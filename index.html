<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Tank - Bounce & Shield Update</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0d0d0d; color: #eee; font-family: 'Segoe UI', monospace; display: flex; height: 100vh; overflow: hidden; }
        #game-wrapper { display: flex; width: 100%; height: 100%; }
        #game-container { position: relative; flex: 2; background: #000; display: flex; justify-content: center; align-items: center; border-right: 2px solid #333; }
        canvas { background: #000; box-shadow: 0 0 30px rgba(0,0,0,0.8); cursor: crosshair; max-width: 100%; max-height: 100%; }
        #dashboard { flex: 1; min-width: 250px; padding: 20px; background: #121212; display: flex; flex-direction: column; gap: 15px; z-index: 5; }
        .panel-box { background: #1f1f1f; padding: 12px; border-radius: 6px; border: 1px solid #333; }
        .stat-label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 3px; }
        .progress-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.2s; }
        #bar-attack { background: linear-gradient(90deg, #c0392b, #e74c3c); }
        #bar-chase { background: linear-gradient(90deg, #2980b9, #3498db); }
        #bar-loot { background: linear-gradient(90deg, #f39c12, #f1c40f); }
        #log-box { flex-grow: 1; overflow-y: auto; font-size: 11px; color: #888; border-top: 1px solid #333; padding-top: 5px; font-family: 'Consolas', monospace; }
        .log-entry { margin-bottom: 3px; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: opacity 0.3s; }
        .hidden { display: none !important; }
        h1 { font-size: 50px; color: #e74c3c; text-transform: uppercase; margin-bottom: 30px; letter-spacing: 5px; text-shadow: 0 0 20px #c0392b; text-align: center;}
        .menu-btn { padding: 15px 40px; margin: 10px; font-size: 20px; font-weight: bold; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; width: 300px; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .menu-btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-solo { background: #3498db; } .btn-solo:hover { background: #2980b9; }
        .btn-surv { background: #e67e22; } .btn-surv:hover { background: #d35400; }
        .btn-restart { background: #27ae60; } .btn-restart:hover { background: #2ecc71; }
        .btn-home { background: #7f8c8d; } .btn-home:hover { background: #95a5a6; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
            
            <div id="main-menu" class="overlay-screen">
                <h1>CHAOS TANK</h1>
                <div style="color: #aaa; margin-bottom: 20px;">CHỌN CHẾ ĐỘ</div>
                <button class="menu-btn btn-solo" onclick="startGame('SOLO')">ĐẤU ĐƠN (1vs1)</button>
                <button class="menu-btn btn-surv" onclick="startGame('SURVIVAL')">SINH TỒN (Map Rộng)</button>
                <button class="menu-btn" style="background:#9b59b6" onclick="startGame('ONLINE')">CHƠI ONLINE (PVP)</button>
            </div>

            <div id="game-over-screen" class="overlay-screen hidden">
                <div id="go-title" style="font-size: 40px; font-weight: bold; margin-bottom: 20px; color: #e74c3c">KẾT THÚC</div>
                <button class="menu-btn btn-restart" onclick="restartGame()">CHƠI LẠI</button>
                <button class="menu-btn btn-home" onclick="showMainMenu()">VỀ MENU CHÍNH</button>
            </div>
        </div>

        <div id="dashboard">
            <h2 style="color: #e74c3c; margin: 0; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px;">BẢNG ĐIỀU KHIỂN</h2>
            <div class="panel-box">
                <div style="font-size: 10px; color: #888;">TRẠNG THÁI AI</div>
                <div id="ai-state" style="font-size: 28px; font-weight: bold; color: #3498db;">ĐỨNG YÊN</div>
                <div id="ai-weapon" style="font-size: 13px; color: #ccc;">Vũ khí: NORMAL</div>
            </div>
            <div class="panel-box">
                <div class="stat-label"><span>TẤN CÔNG</span> <span id="score-attack">0</span></div>
                <div class="progress-bg"><div id="bar-attack" class="progress-fill" style="width:0%"></div></div>
                <div class="stat-label"><span>TRUY ĐUỔI</span> <span id="score-chase">0</span></div>
                <div class="progress-bg"><div id="bar-chase" class="progress-fill" style="width:0%"></div></div>
                <div class="stat-label"><span>NHẶT ĐỒ</span> <span id="score-loot">0</span></div>
                <div class="progress-bg"><div id="bar-loot" class="progress-fill" style="width:0%"></div></div>
            </div>
            <div class="panel-box" style="display: flex; justify-content: space-between; font-size: 12px;">
                <div>Kẻ thù: <span id="val-hp-bot" style="color:#e74c3c">1</span></div>
                <div>HP Bạn: <span id="val-hp-player" style="color:#3498db">100</span>%</div>
            </div>
            <div id="log-box"></div>
        </div>
    </div>

<script>
// --- KHỞI TẠO SOCKET ---
const socket = (typeof io !== 'undefined') ? io() : { on:()=>{}, emit:()=>{} };
let myId = null;
socket.on("connect", () => { myId = socket.id; console.log("Connected:", myId); });

// --- CẤU HÌNH ---
const CANVAS_SIZE = 600;
let TILE_SIZE = 40; 
let VIEW_TILES = 15;
const HEAVY_SPEED = 5.0; 
const NORMAL_SPEED = 7.0; 
const LASER_SPEED = 12.0;
const LASER_COLOR = '#00ffff';
let PLAYER_SPEED, BOT_SPEED;
const START_DELAY = 2000;

const SOLO_MAPS = ["010000000110000010110000110000010110000000000010000000001000010000000001000010100110001000000100110001000000100000001000000100000001010000100000001010000100000000010000100000000010000000110000010000000110000010000000000000010"];

// --- BIẾN TOÀN CỤC ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let player = null, bots = [], otherPlayers = {}, walls = [], bullets = [], items = [], particles = [];
let gameRunning = false, keys = {}, mouse = {x: 0, y: 0}, gridMap = [], gridSize = 15;
let camera = {x: 0, y: 0}, currentMode = 'SOLO', actualGameStart = 0, laserBeam = null;
let spawnIntervalId = null;

const ui = {
    mainMenu: document.getElementById('main-menu'),
    gameOver: document.getElementById('game-over-screen'),
    state: document.getElementById('ai-state'),
    weapon: document.getElementById('ai-weapon'),
    bars: { attack: document.getElementById('bar-attack'), chase: document.getElementById('bar-chase'), loot: document.getElementById('bar-loot') },
    logBox: document.getElementById('log-box'),
    hp: { bot: document.getElementById('val-hp-bot'), player: document.getElementById('val-hp-player') }
};

// --- LOGIC GAME ---
function log(msg) {
    const div = document.createElement('div');
    div.className = 'log-entry';
    div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
    ui.logBox.prepend(div);
}

class Tank {
    constructor(x, y, color, isBot) {
        this.x = x; this.y = y; this.color = color; this.isBot = isBot;
        this.angle = 0; this.hp = 100; this.weapon = 'NORMAL'; this.cooldown = 0;
        this.size = TILE_SIZE * 0.8; this.hasShield = false;
        this.recoilX = 0; this.recoilY = 0;
    }
    update() {
        if (this.cooldown > 0) this.cooldown--;
        this.x += this.recoilX; this.y += this.recoilY;
        this.recoilX *= 0.8; this.recoilY *= 0.8;
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        if (this.hasShield) {
            ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI*2);
            ctx.strokeStyle = '#3498db'; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.fillStyle = "#333"; ctx.fillRect(0, -2, this.size, 4);
        ctx.restore();
    }
    shoot() {
        if (this.cooldown > 0) return;
        const muzzleX = this.x + Math.cos(this.angle) * this.size;
        const muzzleY = this.y + Math.sin(this.angle) * this.size;
        
        if (currentMode === 'ONLINE' && !this.isBot) {
            socket.emit('playerShoot', { x: muzzleX, y: muzzleY, angle: this.angle, type: this.weapon });
        }

        if (this.weapon === 'BOUNCE') {
            for(let i=-1; i<=1; i+=2) {
                bullets.push(new Bullet(muzzleX, muzzleY, this.angle + i*0.2, 'BOUNCE', this));
            }
            this.cooldown = 30;
        } else if (this.weapon === 'HEAVY') {
            for(let i=-2; i<=2; i++) {
                bullets.push(new Bullet(muzzleX, muzzleY, this.angle + i*0.1, 'HEAVY', this));
            }
            this.cooldown = 60; this.weapon = 'NORMAL';
        } else {
            bullets.push(new Bullet(muzzleX, muzzleY, this.angle, 'NORMAL', this));
            this.cooldown = 20;
        }
    }
}

class Bullet {
    constructor(x, y, angle, type, owner) {
        this.x = x; this.y = y; this.vx = Math.cos(angle) * (type === 'HEAVY' ? HEAVY_SPEED : NORMAL_SPEED);
        this.vy = Math.sin(angle) * (type === 'HEAVY' ? HEAVY_SPEED : NORMAL_SPEED);
        this.type = type; this.owner = owner; this.dead = false; this.bounces = type === 'BOUNCE' ? 3 : 0;
    }
    update() {
        let nx = this.x + this.vx, ny = this.y + this.vy;
        if (checkWallCollision(nx, ny, 2)) {
            if (this.bounces > 0) {
                this.vx *= -1; this.vy *= -1; this.bounces--;
            } else this.dead = true;
        }
        this.x += this.vx; this.y += this.vy;
    }
    draw() {
        ctx.fillStyle = this.type === 'BOUNCE' ? '#2ecc71' : '#f1c40f';
        ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill();
    }
}

class Item {
    constructor(x, y, type) { this.x = x; this.y = y; this.type = type; this.dead = false; }
    draw() {
        ctx.fillStyle = this.type === 'SHIELD' ? '#3498db' : '#e67e22';
        ctx.fillRect(this.x-10, this.y-10, 20, 20);
    }
}

// --- HỆ THỐNG MAP & VA CHẠM ---
function checkWallCollision(x, y, r) {
    for(let w of walls) {
        if(x+r > w.x && x-r < w.x+w.w && y+r > w.y && y-r < w.y+w.h) return true;
    }
    return false;
}

function startGame(mode) {
    currentMode = mode;
    gameRunning = true;
    ui.mainMenu.classList.add('hidden');
    ui.gameOver.classList.add('hidden');
    
    // Khởi tạo player
    player = new Tank(100, 100, '#3498db', false);
    walls = []; bullets = []; items = []; bots = [];
    
    // Map đơn giản
    walls.push({x: 300, y: 200, w: 40, h: 200});
    
    requestAnimationFrame(gameLoop);
    log("Trận đấu bắt đầu: " + mode);
}

function gameLoop() {
    if (!gameRunning) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function update() {
    // Di chuyển người chơi
    if (keys['w']) player.y -= 3;
    if (keys['s']) player.y += 3;
    if (keys['a']) player.x -= 3;
    if (keys['d']) player.x += 3;
    
    player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    player.update();

    // Cập nhật đạn
    bullets.forEach((b, index) => {
        b.update();
        if (b.dead) bullets.splice(index, 1);
    });

    // Check nhặt đồ
    items.forEach((item, index) => {
        if (Math.hypot(player.x - item.x, player.y - item.y) < 30) {
            if (item.type === 'SHIELD') player.hasShield = true;
            else player.weapon = item.type;
            items.splice(index, 1);
            log("Nhặt được: " + item.type);
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    walls.forEach(w => { ctx.fillStyle = '#555'; ctx.fillRect(w.x, w.y, w.w, w.h); });
    items.forEach(i => i.draw());
    bullets.forEach(b => b.draw());
    if (player) player.draw();
}

// --- EVENT LISTENERS ---
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', () => { if(player) player.shoot(); });

function showMainMenu() {
    gameRunning = false;
    ui.mainMenu.classList.remove('hidden');
}

function restartGame() { startGame(currentMode); }

</script>
</body>
</html>
