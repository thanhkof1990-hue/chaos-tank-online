<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chaos Tank</title>

<style>

body{
margin:0;
background:#000;
color:white;
font-family:Arial;
display:flex;
}

#menu{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:15px;
}

.menu-btn{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
color:white;
}

#game{
display:none;
}

canvas{
background:#111;
}

</style>
</head>

<body>

<div id="menu">

<h1>CHAOS TANK</h1>

<button class="menu-btn" style="background:#3498db"
onclick="startGame('DUEL')">
ĐẤU ĐƠN (1vs1)
</button>

<button class="menu-btn" style="background:#e67e22"
onclick="startGame('SURVIVAL')">
SINH TỒN
</button>

<button class="menu-btn" style="background:#9b59b6"
onclick="startGame('ONLINE')">
CHƠI ONLINE
</button>

</div>

<div id="game">
<canvas id="gameCanvas" width="900" height="600"></canvas>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const canvas = document.getElementById("gameCanvas")
const ctx = canvas.getContext("2d")

const socket = io()

let gameMode="PVE"

let bullets=[]
let otherPlayers={}

const TILE_SIZE=40
const NORMAL_SPEED=8
const HEAVY_SPEED=5
const LASER_SPEED=15

let player=null

function startGame(mode){

gameMode=mode

document.getElementById("menu").style.display="none"
document.getElementById("game").style.display="block"

initGame()

}

function initGame(){

player=new Tank(200,200)

requestAnimationFrame(gameLoop)

}

class Tank{

constructor(x,y){

this.x=x
this.y=y
this.angle=0
this.speed=3
this.hp=100

}

update(){

if(keys["w"]) this.y-=this.speed
if(keys["s"]) this.y+=this.speed
if(keys["a"]) this.x-=this.speed
if(keys["d"]) this.x+=this.speed

}

draw(){

ctx.fillStyle="green"
ctx.fillRect(this.x-15,this.y-15,30,30)

}

shoot(type){

let muzzleX=this.x+Math.cos(this.angle)*30
let muzzleY=this.y+Math.sin(this.angle)*30

bullets.push(new Bullet(muzzleX,muzzleY,this.angle,type,this))

if(gameMode==="ONLINE"){

socket.emit("shoot",{
x:muzzleX,
y:muzzleY,
angle:this.angle,
type:type
})

}

}

}

class Bullet{

constructor(x,y,angle,type,owner){

this.x=x
this.y=y
this.angle=angle
this.type=type
this.owner=owner

if(type==="HEAVY") this.speed=HEAVY_SPEED
else if(type==="LASER") this.speed=LASER_SPEED
else this.speed=NORMAL_SPEED

this.size=6

this.vx=Math.cos(angle)*this.speed
this.vy=Math.sin(angle)*this.speed

this.dead=false

}

update(){

this.x+=this.vx
this.y+=this.vy

if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height){

this.dead=true

}

}

draw(){

ctx.beginPath()
ctx.arc(this.x,this.y,4,0,Math.PI*2)
ctx.fillStyle="yellow"
ctx.fill()

}

}

function gameLoop(){

update()
draw()

requestAnimationFrame(gameLoop)

}

function update(){

player.update()

for(let b of bullets){

b.update()

}

bullets=bullets.filter(b=>!b.dead)

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

player.draw()

for(let b of bullets){

b.draw()

}

for(let id in otherPlayers){

let p=otherPlayers[id]

ctx.fillStyle="red"
ctx.fillRect(p.x-15,p.y-15,30,30)

}

}

const keys={}

window.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true

if(e.key===" "){

player.shoot("NORMAL")

}

})

window.addEventListener("keyup",e=>{

keys[e.key.toLowerCase()]=false

})

socket.on("currentPlayers",players=>{

for(let id in players){

if(id===socket.id) continue

otherPlayers[id]=players[id]

}

})

socket.on("playerMoved",data=>{

if(otherPlayers[data.id]){

otherPlayers[data.id].x=data.x
otherPlayers[data.id].y=data.y

}

})

socket.on("bulletFired",data=>{

bullets.push(new Bullet(data.x,data.y,data.angle,data.type,null))

})

</script>

</body>
</html>
